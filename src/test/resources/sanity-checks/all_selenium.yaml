id: all_selenium
namespace: sanitychecks.plugin-selenium

# Self-contained sanity check. Starts a Selenium Grid (Chromium) container, drives it
# with the Browse task against an inline data: URL (no external network), and asserts the
# extracted text, screenshot, and script result. Run during release QA.

tasks:
  - id: init
    type: io.kestra.plugin.core.output.OutputValues
    values:
      gridPort: "{{ randomPort() }}"

  - id: grid_start
    type: io.kestra.plugin.docker.Run
    containerImage: selenium/standalone-chromium:latest
    portBindings:
      - "{{ outputs.init.values.gridPort }}:4444"
    wait: false
    env:
      SE_NODE_ENABLE_MANAGED_DOWNLOADS: "true"

  # give the grid time to register a node and report ready
  - id: wait_grid
    type: io.kestra.plugin.core.flow.Sleep
    duration: PT25S

  - id: browse
    type: io.kestra.plugin.selenium.Browse
    remoteUrl: "http://localhost:{{ outputs.init.values.gridPort }}"
    browser: CHROME
    headless: true
    actions:
      - action: NAVIGATE
        url: "data:text/html,<html><body><h1 id='title'>Hello Sanity</h1><p class='item'>one</p><p class='item'>two</p></body></html>"
      - action: WAIT_FOR
        selector: "#title"
      - action: EXTRACT_TEXT
        id: heading
        selector: "#title"
      - action: EXTRACT_TEXT
        id: items
        selector: ".item"
        multiple: true
      - action: EXECUTE_SCRIPT
        id: itemCount
        script: "return document.querySelectorAll('.item').length;"
      - action: SCREENSHOT
        name: sanity.png

  - id: assert
    type: io.kestra.plugin.core.execution.Assert
    conditions:
      - "{{ outputs.browse.extracted.heading == 'Hello Sanity' }}"
      - "{{ (outputs.browse.extracted.items | length) == 2 }}"
      - "{{ outputs.browse.scriptResults.itemCount == 2 }}"
      - "{{ outputs.browse.screenshots['sanity.png'] != null }}"
