# Selenium Grid for running integration tests locally and in CI.
# Start it, export SELENIUM_GRID_URL, then run the build:
#
#   docker compose -f docker-compose-ci.yml up -d
#   export SELENIUM_GRID_URL=http://localhost:4444
#   ./gradlew clean build
#   docker compose -f docker-compose-ci.yml down

services:
  selenium:
    # multi-arch (amd64 + arm64/Apple Silicon) Chromium image, 4.21.0+
    image: selenium/standalone-chromium:4.27.0
    shm_size: "2gb"
    ports:
      - "4444:4444"   # WebDriver / Grid endpoint
      - "7900:7900"   # noVNC, watch the browser at http://localhost:7900
    environment:
      SE_NODE_MAX_SESSIONS: "4"
      SE_NODE_SESSION_TIMEOUT: "120"
      SE_NODE_ENABLE_MANAGED_DOWNLOADS: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4444/wd/hub/status"]
      interval: 5s
      timeout: 3s
      retries: 10
